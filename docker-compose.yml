version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: jewelry-postgres
    environment:
      POSTGRES_USER: jewelry
      POSTGRES_PASSWORD: jewelry123
      POSTGRES_DB: jewelry_aftersales
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jewelry"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
