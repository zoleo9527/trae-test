version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: fruit-complaint-db
    environment:
      POSTGRES_DB: fruit_complaint
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-data:
